			<script>
				function ClearDateRange(dateafterfield, datebeforefield) {
					var dateafter = jQuery('input[name=' + dateafterfield + ']');
					var datebefore = jQuery('input[name=' + datebeforefield + ']');
					datebefore.className = '';
					dateafter.className = '';
				}
				function CheckDateRange(dateafterfield, datebeforefield) {
					var dateafter = jQuery('input[name=' + dateafterfield + ']');
					var datebefore = jQuery('input[name=' + datebeforefield + ']');
					var inputdatebefore = new InputWrapper(datebefore);
					var inputdateafter = new InputWrapper(dateafter);
					if  (dateafter.val() != '' && datebefore.val() != '' && dateafter.val() > datebefore.val()) {
						inputdatebefore.MarkInvalid();
						inputdateafter.MarkInvalid();
					}
					else {
						inputdatebefore.MarkValid();
						inputdateafter.MarkValid();
					}
				}
				function UpdatePermissionFieldsOnChange(object) {
					if (! object.value) {
						document.zform.PERMISSIONID.value = '';
						document.zform.PERMISSIONID.disabled = 1;
						document.zform.ROLEID.value = '';
						document.zform.ROLEID.disabled = 1;
						var selectedpermission = jQuery(document.zform.PERMISSIONID).find(':selected').get(0);
						selectedpermission.textContent = 'Please select a practice.';
						var selectedrole = jQuery(document.zform.ROLEID).find(':selected').get(0);
						selectedrole.textContent = 'Please select a practice.';
					}
				}
				function UpdatePermissionFieldsAndReload() {
					var field = document.zform.CONTEXTNAME;
					if (! field.value) {
						document.zform.PERMISSIONID.value = '';
					}
					document.zform.PERMISSIONID.disabled = ! field.value;

					document.zform.ROLEID.value = '';
					document.zform.ROLEID.disabled = ! field.value;

					document.zform.submit();
				}
				function UpdateMfaFieldsOnChange(includemfapolicy) {
					if(includemfapolicy.value === 'Yes') {
						jQuery('#MFAPOLICYSELECT').removeClass('formelementhidden');
					}
					else {
						jQuery('#MFAPOLICYSELECT').addClass('formelementhidden');
					}
				}
			</script>
